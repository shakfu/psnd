name: Build All Variants

on:
  schedule:
    # Nightly at 04:00 UTC: covers the variant/platform combinations that the
    # per-push workflows do not build.
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.variant }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        variant:
          - tsf
          - tsf-csound
          - fluid
          - fluid-csound
          - tsf-web
          - fluid-web
          - fluid-csound-web
          - tsf-native
        exclude:
          # webview's Edge backend needs the WebView2 SDK, which is not vendored
          - os: windows-latest
            variant: tsf-native
        include:
          # --- variant -> cmake flags mapping ---
          - variant: tsf
            cmake_args: ""
          - variant: tsf-csound
            cmake_args: "-DBUILD_CSOUND_BACKEND=ON"
          - variant: fluid
            cmake_args: "-DBUILD_FLUID_BACKEND=ON"
          - variant: fluid-csound
            cmake_args: "-DBUILD_FLUID_BACKEND=ON -DBUILD_CSOUND_BACKEND=ON"
          - variant: tsf-web
            cmake_args: "-DBUILD_WEB_HOST=ON"
          - variant: fluid-web
            cmake_args: "-DBUILD_FLUID_BACKEND=ON -DBUILD_WEB_HOST=ON"
          - variant: fluid-csound-web
            cmake_args: "-DBUILD_FLUID_BACKEND=ON -DBUILD_CSOUND_BACKEND=ON -DBUILD_WEB_HOST=ON"
          - variant: tsf-native
            cmake_args: "-DBUILD_WEBVIEW_HOST=ON"
          # --- os -> platform label mapping ---
          - os: ubuntu-latest
            platform: linux
            binary_path: build/psnd
            artifact_ext: ""
          - os: macos-latest
            platform: macos
            binary_path: build/psnd
            artifact_ext: ""
          - os: windows-latest
            platform: windows
            binary_path: build/Release/psnd.exe
            artifact_ext: ".exe"
    env:
      BUILD_DIR: build
      BUILD_TYPE: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Extract version from CMakeLists.txt (Unix)
        if: runner.os != 'Windows'
        id: version-unix
        run: |
          ver=$(sed -n 's/^project(psnd_project VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Extract version from CMakeLists.txt (Windows)
        if: runner.os == 'Windows'
        id: version-win
        shell: pwsh
        run: |
          $content = Get-Content CMakeLists.txt -Raw
          if ($content -match 'project\(psnd_project VERSION (\d+\.\d+\.\d+)') {
            echo "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          }

      - name: Set version output
        id: version
        shell: bash
        run: |
          ver="${{ steps.version-unix.outputs.version }}${{ steps.version-win.outputs.version }}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Install webview dependencies (Linux)
        if: runner.os == 'Linux' && endsWith(matrix.variant, '-native')
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTING=ON \
            ${{ matrix.cmake_args }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $allArgs = "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TESTING=ON ${{ matrix.cmake_args }}"
          $cmakeArgs = @($allArgs -split '\s+' | Where-Object { $_ -ne '' })
          cmake -S . -B ${{ env.BUILD_DIR }} @cmakeArgs

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Run tests
        run: ctest --test-dir ${{ env.BUILD_DIR }} --output-on-failure --timeout 120 -C ${{ env.BUILD_TYPE }}

      - name: Collect artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          name="psnd-${{ steps.version.outputs.version }}-${{ matrix.variant }}-${{ matrix.platform }}"
          mkdir -p artifacts
          cp "${{ matrix.binary_path }}" "$name"
          tar -czf "artifacts/${name}.tar.gz" "$name"

      - name: Collect artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "psnd-${{ steps.version.outputs.version }}-${{ matrix.variant }}-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item "${{ matrix.binary_path }}" "${name}.exe"
          Compress-Archive -Path "${name}.exe" -DestinationPath "artifacts/${name}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: psnd-${{ steps.version.outputs.version }}-${{ matrix.variant }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  bundle:
    name: Bundle all artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build]
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from CMakeLists.txt
        id: version
        run: |
          ver=$(sed -n 's/^project(psnd_project VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: psnd-${{ steps.version.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create archive
        run: tar -czf psnd-${{ steps.version.outputs.version }}-all-variants.tar.gz -C dist .

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: psnd-${{ steps.version.outputs.version }}-all-variants-bundle
          path: psnd-${{ steps.version.outputs.version }}-all-variants.tar.gz
          if-no-files-found: error
