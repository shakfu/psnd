name: Build Variant

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'tsf'
        type: choice
        options:
          - tsf
          - tsf-csound
          - fluid
          - fluid-csound
          - tsf-web
          - fluid-web
          - fluid-csound-web
          - tsf-native

jobs:
  # Build for Linux and macOS
  build-unix:
    name: Build ${{ inputs.variant }} (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact_suffix: linux
            binary_path: build/psnd
          - name: macOS
            os: macos-latest
            artifact_suffix: macos
            binary_path: build/psnd
    env:
      BUILD_DIR: build
      BUILD_TYPE: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from CMakeLists.txt
        id: version
        run: |
          ver=$(sed -n 's/^project(psnd_project VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Install FluidSynth (Linux)
        if: matrix.os == 'ubuntu-latest' && contains(inputs.variant, 'fluid')
        run: sudo apt-get update && sudo apt-get install -y libfluidsynth-dev

      - name: Install FluidSynth (macOS)
        if: matrix.os == 'macos-latest' && contains(inputs.variant, 'fluid')
        run: brew install fluid-synth

      - name: Install webview dependencies (Linux)
        if: matrix.os == 'ubuntu-latest' && endsWith(inputs.variant, '-native')
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Configure CMake
        run: |
          CMAKE_OPTS="-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}"

          case "${{ inputs.variant }}" in
            tsf)
              # Default: TinySoundFont only (no extra flags)
              ;;
            tsf-csound)
              CMAKE_OPTS="$CMAKE_OPTS -DBUILD_CSOUND_BACKEND=ON"
              ;;
            fluid)
              CMAKE_OPTS="$CMAKE_OPTS -DBUILD_FLUID_BACKEND=ON"
              ;;
            fluid-csound)
              CMAKE_OPTS="$CMAKE_OPTS -DBUILD_FLUID_BACKEND=ON -DBUILD_CSOUND_BACKEND=ON"
              ;;
            tsf-web)
              CMAKE_OPTS="$CMAKE_OPTS -DBUILD_WEB_HOST=ON"
              ;;
            fluid-web)
              CMAKE_OPTS="$CMAKE_OPTS -DBUILD_FLUID_BACKEND=ON -DBUILD_WEB_HOST=ON"
              ;;
            fluid-csound-web)
              CMAKE_OPTS="$CMAKE_OPTS -DBUILD_FLUID_BACKEND=ON -DBUILD_CSOUND_BACKEND=ON -DBUILD_WEB_HOST=ON"
              ;;
            tsf-native)
              CMAKE_OPTS="$CMAKE_OPTS -DBUILD_WEBVIEW_HOST=ON"
              ;;
          esac

          cmake -S . -B ${{ env.BUILD_DIR }} $CMAKE_OPTS

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Collect artifact
        run: |
          cmake -E make_directory artifacts
          cmake -E copy "${{ matrix.binary_path }}" "artifacts/psnd-${{ steps.version.outputs.version }}-${{ inputs.variant }}-${{ matrix.artifact_suffix }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: psnd-${{ steps.version.outputs.version }}-${{ inputs.variant }}-${{ matrix.artifact_suffix }}
          path: artifacts/*
          if-no-files-found: error

  # Build for Windows (MSVC)
  # Note: winflexbison is bundled in source/thirdparty/winflexbison/
  #       dirent.h and posix_compat.h are bundled in source/thirdparty/dirent/
  build-windows:
    name: Build ${{ inputs.variant }} (Windows MSVC)
    # webview's Edge backend needs the WebView2 SDK, which is not vendored
    if: ${{ !endsWith(inputs.variant, '-native') }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BUILD_DIR: build
      BUILD_TYPE: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from CMakeLists.txt
        id: version
        shell: pwsh
        run: |
          $content = Get-Content CMakeLists.txt -Raw
          if ($content -match 'project\(psnd_project VERSION (\d+\.\d+\.\d+)') {
            echo "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          $CMAKE_OPTS = "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TESTING=ON"

          switch ("${{ inputs.variant }}") {
            "tsf" {
              # Default: TinySoundFont only (no extra flags)
            }
            "tsf-csound" {
              $CMAKE_OPTS = "$CMAKE_OPTS -DBUILD_CSOUND_BACKEND=ON"
            }
            "fluid" {
              $CMAKE_OPTS = "$CMAKE_OPTS -DBUILD_FLUID_BACKEND=ON"
            }
            "fluid-csound" {
              $CMAKE_OPTS = "$CMAKE_OPTS -DBUILD_FLUID_BACKEND=ON -DBUILD_CSOUND_BACKEND=ON"
            }
            "tsf-web" {
              $CMAKE_OPTS = "$CMAKE_OPTS -DBUILD_WEB_HOST=ON"
            }
            "fluid-web" {
              $CMAKE_OPTS = "$CMAKE_OPTS -DBUILD_FLUID_BACKEND=ON -DBUILD_WEB_HOST=ON"
            }
            "fluid-csound-web" {
              $CMAKE_OPTS = "$CMAKE_OPTS -DBUILD_FLUID_BACKEND=ON -DBUILD_CSOUND_BACKEND=ON -DBUILD_WEB_HOST=ON"
            }
          }

          $cmakeArgs = $CMAKE_OPTS -split ' '
          cmake -S . -B ${{ env.BUILD_DIR }} @cmakeArgs

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Run tests
        run: |
          cd ${{ env.BUILD_DIR }}
          ctest --output-on-failure --timeout 120 -C ${{ env.BUILD_TYPE }}

      - name: Collect artifact
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item "build/${{ env.BUILD_TYPE }}/psnd.exe" "artifacts/psnd-${{ steps.version.outputs.version }}-${{ inputs.variant }}-windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: psnd-${{ steps.version.outputs.version }}-${{ inputs.variant }}-windows
          path: artifacts/*
          if-no-files-found: error

  bundle:
    name: Bundle artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-unix, build-windows]
    if: always() && (needs.build-unix.result == 'success' || needs.build-windows.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from CMakeLists.txt
        id: version
        run: |
          ver=$(sed -n 's/^project(psnd_project VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: psnd-${{ steps.version.outputs.version }}-${{ inputs.variant }}-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create unified archive
        run: |
          tar -czf psnd-${{ steps.version.outputs.version }}-${{ inputs.variant }}-all-platforms.tar.gz -C dist .

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: psnd-${{ steps.version.outputs.version }}-${{ inputs.variant }}-cross-platform
          path: psnd-${{ steps.version.outputs.version }}-${{ inputs.variant }}-all-platforms.tar.gz
          if-no-files-found: error
