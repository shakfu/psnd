name: release

on:
  push:
    tags:
      # Releases are tagged as bare semver (e.g. `0.1.7`). The `v`-prefixed
      # form is also accepted in case the convention ever changes.
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. 0.1.7 or v0.1.7). Must already exist on origin.'
        required: true

jobs:
  preflight:
    name: vendored sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # Gates the 21 build legs: a file dropped from the checkout by a
      # vendored .gitignore fails them all, ~40 minutes in, on a spent tag.
      - run: python3 scripts/check_vendored.py

  build:
    name: build (${{ matrix.target }}, ${{ matrix.variant }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # No fail-fast: a single bad variant should not cancel the others. The
      # whole `build` job still reports failure if any leg fails, which gates
      # `publish` below -- so a broken variant blocks the release rather than
      # shipping a partial set.
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
        # Same seven variants as the "Build All Variants" matrix workflow.
        variant:
          - tsf
          - tsf-csound
          - fluid
          - fluid-csound
          - tsf-web
          - fluid-web
          - fluid-csound-web
        include:
          # os -> release target label (also used to name the archive)
          - os: macos-14
            target: macos-arm64
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    defaults:
      run:
        shell: bash
    steps:
      # Fail fast and loudly when a manually-dispatched tag doesn't exist on
      # origin. Without this, actions/checkout retries three times and fails
      # with an opaque "git failed" message instead of "no such tag".
      - name: verify tag exists on origin
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ github.event.inputs.tag }}"
          TAG="${TAG#refs/tags/}"
          REMOTE="${{ github.server_url }}/${{ github.repository }}"
          echo "Verifying tag '$TAG' on $REMOTE..."
          if git ls-remote --tags --exit-code "$REMOTE" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Resolved: $TAG"
          else
            echo "::error::tag '$TAG' does not exist on origin."
            echo "::error::Push it first:  git tag $TAG && git push origin $TAG"
            echo "Available tags on $REMOTE:"
            git ls-remote --tags "$REMOTE" 2>/dev/null \
              | awk -F'refs/tags/' '{print "  " $2}' | sort -V | tail -20
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: install linux deps
        if: runner.os == 'Linux'
        # libasound2-dev / libudev-dev: libremidi's ALSA backend needs the
        # alsa/asoundlib.h header and udev at configure time. flex/bison are
        # used by the Csound parser generation in the *-csound variants.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git flex bison libasound2-dev libudev-dev

      - name: install macos deps
        if: runner.os == 'macOS'
        run: |
          if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi

      - name: build + package
        # build_release.py configures (Release), builds, runs ctest, smoke-tests
        # `psnd -V`, strips, and writes the versioned archive. The default `tsf`
        # variant is named psnd-<version>-<target>.{tar.gz,zip}; every other
        # variant appends its name, e.g. psnd-<version>-<target>-fluid-csound.*.
        # On Windows the Csound variants trigger CMake's winflexbison download.
        run: python3 scripts/build_release.py --variant ${{ matrix.variant }} --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          # One artifact per (target, variant) leg; merged in publish.
          name: ${{ matrix.target }}-${{ matrix.variant }}
          path: dist/psnd-*
          if-no-files-found: error

  publish:
    needs: build
    # `needs: build` with the default success requirement means publish runs
    # only when EVERY matrix leg (all 7 variants x 3 platforms) succeeded.
    # Any failure blocks the release -- no partial publishes.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: list staged files
        run: ls -la dist/

      - name: extract release notes from CHANGELOG
        # Pulls the `## [<version>]` section out of CHANGELOG.md into
        # release-notes.md (falling back to `## [Unreleased]`). Exit 0 = found,
        # use it as the release body; exit 2 = let GitHub auto-generate notes.
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if python3 scripts/release_notes.py "${VERSION}"; then
            echo "FOUND=1" >> "$GITHUB_ENV"
            echo "--- release-notes.md ---"; cat release-notes.md
          else
            echo "FOUND=0" >> "$GITHUB_ENV"
          fi

      - name: create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: ${{ env.FOUND == '1' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ env.FOUND != '1' }}
          # Attach every variant archive: tar.gz from macOS/Linux, zip from
          # Windows. Completeness is enforced by the matrix gate above (a
          # missing variant fails its build leg and blocks this job), so broad
          # globs are sufficient here. Both must match at least one file.
          files: |
            dist/psnd-*.tar.gz
            dist/psnd-*.zip
          fail_on_unmatched_files: true
